<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente de Telemetría Móvil (16 Bytes)</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 15px; background: #121212; color: #fff; margin: 0; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #333; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #aaa; }
        input { width: 100%; padding: 10px; font-size: 14px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        button { width: 100%; padding: 12px; margin: 6px 0; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .btn-gps { background-color: #2e7d32; color: #fff; }
        .btn-stop { background-color: #c62828; color: #fff; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .metric-box { background: #2a2a2a; padding: 10px; border-radius: 6px; border: 1px solid #444; text-align: center; }
        .metric-val { font-size: 16px; font-weight: bold; color: #4caf50; }
        .metric-lbl { font-size: 11px; color: #aaa; }
        .log { background: #000; padding: 10px; font-family: monospace; height: 240px; overflow-y: auto; border: 1px solid #333; font-size: 12px; border-radius: 6px; }
        .dev-badge { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace; color: #4caf50; }
        hr { border: 0; border-top: 1px solid #222; margin: 6px 0; }
    </style>
</head>
<body>
    <h2>📱 Nodo de Telemetría Móvil</h2>

    <div class="card">
        <label>ID de Dispositivo Único:</label>
        <span id="devIdDisplay" class="dev-badge">Cargando...</span>
    </div>

    <div class="card">
        <label for="serverUrl">URL del Servidor / Ngrok (HTTPS):</label>
        <input type="text" id="serverUrl" placeholder="https://tu-subdominio.ngrok-free.dev">
    </div>

    <div class="card">
        <button class="btn-gps" onclick="iniciarGPSReal()">📍 Iniciar Transmisión GPS Real</button>
        <button class="btn-stop" onclick="detenerTransmision()">⏹ Detener Transmisión</button>

        <div class="metrics-grid">
            <div class="metric-box">
                <div id="mSpeed" class="metric-val">0 km/h</div>
                <div class="metric-lbl">Velocidad Actual</div>
            </div>
            <div class="metric-box">
                <div id="mBattery" class="metric-val">100%</div>
                <div class="metric-lbl">Nivel de Batería</div>
            </div>
        </div>
    </div>

    <h3>Consola de Transmisión:</h3>
    <div id="log" class="log"></div>

    <script>
        let watchId = null;

        // 1. Obtener o generar ID persistente único por dispositivo
        function obtenerDeviceId() {
            let devId = localStorage.getItem('device_telemetry_id');
            if (!devId) {
                devId = 'Movil-' + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('device_telemetry_id', devId);
            }
            return devId;
        }

        const DEVICE_ID = obtenerDeviceId();
        document.getElementById('devIdDisplay').innerText = DEVICE_ID;

        const sensores = {
            lat: 4.60971,
            lon: -74.08175,
            speed: 0,
            seq: 0,
            accelX: 0,
            accelY: 0,
            netType: 3, // 1=2G, 2=3G, 3=4G, 4=WiFi
            osVer: 14,  // Android 14
            battery: 100
        };

        // Capturar Batería Real del Dispositivo
        if ('getBattery' in navigator) {
            navigator.getBattery().then(bat => {
                sensores.battery = Math.round(bat.level * 100);
                document.getElementById('mBattery').innerText = sensores.battery + "%";
                bat.addEventListener('levelchange', () => {
                    sensores.battery = Math.round(bat.level * 100);
                    document.getElementById('mBattery').innerText = sensores.battery + "%";
                });
            });
        }

        // Capturar Acelerómetro Real
        window.addEventListener('devicemotion', (evt) => {
            if (evt.accelerationIncludingGravity) {
                sensores.accelX = Math.round((evt.accelerationIncludingGravity.x || 0) * 10);
                sensores.accelY = Math.round((evt.accelerationIncludingGravity.y || 0) * 10);
            }
        });

        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += msg + "<br><hr>";
            div.scrollTop = div.scrollHeight;
        }

        // Empaquetado Binario de 16 Bytes (Big-Endian !ffBHbbBBB)
        function empaquetar16Bytes() {
            sensores.seq = (sensores.seq + 1) % 65536;

            const buffer = new ArrayBuffer(16);
            const view = new DataView(buffer);

            view.setFloat32(0, sensores.lat, false);     // 4 bytes Lat
            view.setFloat32(4, sensores.lon, false);     // 4 bytes Lon
            view.setUint8(8, sensores.speed);            // 1 byte Vel
            view.setUint16(9, sensores.seq, false);      // 2 bytes Seq
            view.setInt8(11, sensores.accelX);           // 1 byte Accel X
            view.setInt8(12, sensores.accelY);           // 1 byte Accel Y
            view.setUint8(13, sensores.netType);         // 1 byte Red
            view.setUint8(14, sensores.osVer);           // 1 byte SO
            view.setUint8(15, sensores.battery);         // 1 byte Batería

            return buffer;
        }

        async function enviarTrama(buffer) {
            const url = document.getElementById('serverUrl').value.trim();
            if (!url) {
                log("⚠️ Ingresa la URL del servidor / Ngrok primero.");
                return;
            }

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/octet-stream',
                        'X-Device-ID': DEVICE_ID
                    },
                    body: buffer
                });

                if (res.ok) {
                    log(`✅ [Enviado #${sensores.seq}] Lat: ${sensores.lat.toFixed(5)}, Lon: ${sensores.lon.toFixed(5)} | Vel: ${sensores.speed} km/h`);
                }
            } catch (err) {
                log(`❌ Error de red: ${err.message}`);
            }
        }

        // Iniciar GPS Real del Teléfono
        function iniciarGPSReal() {
            detenerTransmision();
            if ("geolocation" in navigator) {
                log("📡 Conectando con el GPS del dispositivo...");
                watchId = navigator.geolocation.watchPosition(pos => {
                    sensores.lat = pos.coords.latitude;
                    sensores.lon = pos.coords.longitude;
                    sensores.speed = Math.round((pos.coords.speed || 0) * 3.6); // m/s a km/h

                    document.getElementById('mSpeed').innerText = sensores.speed + " km/h";

                    const buffer = empaquetar16Bytes();
                    enviarTrama(buffer);
                }, err => log("❌ Error de GPS: " + err.message), { enableHighAccuracy: true });
            } else {
                log("❌ Geolocalización no soportada en este navegador.");
            }
        }

        function detenerTransmision() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                log("⏹ Transmisión GPS detenida.");
            }
        }
    </script>
</body>
</html>
